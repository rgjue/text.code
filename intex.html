<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>今天吃什么？</title>
</head>

<body style="
background-image:url('food.gif');
background-size:cover;
background-repeat:no-repeat;
background-position:center;
background-attachment: fixed;">
    <h1 style="text-align:center;">今天吃什么？</h1>
    <p id="result" style="font-size:30px;color:rgb(215, 102, 22);text-align:center;">点击下面的按钮</p>
    <div style="font-size:30px;text-align:center;">
        <button onclick="pick() ">帮我选!</button>
    </div>

    <script>
        function pick() {
            var foods = ["牛肉滑蛋饭", "隆江猪脚饭", "麻辣烫", "南昌拌粉", "老兵烧烤", "黄焖鸡", "水煮肉片", "麻婆豆腐", "肯德基"];
            var index =
                Math.floor(Math.random() * foods.length);
            document.getElementById("result").innerText = foods[index];
        }
    </script>
</body>

</html>
